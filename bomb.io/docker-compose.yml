version: "3.9"

services:
  api:
    build: ./server
    container_name: bombio-api
    ports:
      - "3001:3001"
    networks:
      - web   # <- HIER

  client:
    build: ./client
    container_name: bombio-client
    ports:
      - "81:81"
    networks:
      - web   # <- HIER

networks:
  web:
    external: true
